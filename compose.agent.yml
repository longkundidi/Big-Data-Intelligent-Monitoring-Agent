services:
  agent:
    build:
      context: ./agent-service
    container_name: streamdoctor-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8099"
    environment:
      AGENT_DB_PATH: /data/streamdoctor.db
      AGENT_TOPOLOGY_PATH: /app/topology.json
      AGENT_POLL_ENABLED: "true"
      AGENT_TRUSTED_NETWORKS: 172.18.0.0/16
      FLINK_REST_URL: http://jobmanager:8081
      KAFKA_SERVERS: kafka:9092
      MODEL_HEALTH_URL: ${MODEL_HEALTH_URL:-http://regtcn-model:8000/healthz}
      AGENT_MODEL_METRICS_LOG: ${AGENT_MODEL_METRICS_LOG:-}
      AGENT_LOG_PATH: ${AGENT_LOG_PATH:-}
      AGENT_PROJECT_SCAN_ROOT: /workspace
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-gpt-5.6-luna}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-high}
      AGENT_EXECUTOR_URL: http://executor:8100
      EXECUTOR_SHARED_TOKEN: ${EXECUTOR_SHARED_TOKEN:-}
    volumes:
      - agent-data:/data
      - ./:/workspace:ro
    mem_limit: 1200m
    networks:
      - streamdoctor

  executor:
    build:
      context: ./agent-service
    container_name: streamdoctor-executor
    restart: unless-stopped
    command: ["uvicorn", "streamdoctor.executor_api:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      EXECUTOR_SHARED_TOKEN: ${EXECUTOR_SHARED_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 160m
    networks:
      - streamdoctor

volumes:
  agent-data:

networks:
  streamdoctor:
    name: streamdoctor_default
    external: true
