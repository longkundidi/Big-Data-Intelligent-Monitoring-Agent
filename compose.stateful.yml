services:
  pig-mysql:
    image: mysql:8.0.32
    container_name: streamdoctor-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=300
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migration/mysql-apps-20260922.sql.gz:/docker-entrypoint-initdb.d/10-apps.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1400m
    networks:
      streamdoctor:
        aliases: [pig-mysql]

  pig-redis:
    image: redis:7.0.9
    container_name: streamdoctor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "3600", "1", "300", "100", "60", "10000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./state/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks:
      streamdoctor:
        aliases: [pig-redis]

  pig-register:
    image: nacos/nacos-server:v2.2.0
    container_name: streamdoctor-nacos
    restart: unless-stopped
    depends_on:
      pig-mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: pig-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: pig_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      NACOS_AUTH_ENABLE: "false"
    volumes:
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/server/state >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 900m
    networks:
      streamdoctor:
        aliases: [pig-register]

  pig-minio:
    image: quay.io/minio/minio:RELEASE.2022-09-07T22-25-02Z
    container_name: streamdoctor-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":18000"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:18000:18000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - ./state/minio:/data
    mem_limit: 512m
    networks:
      streamdoctor:
        aliases: [pig-minio, minio-server]

volumes:
  mysql-data:
  nacos-logs:

networks:
  streamdoctor:
    name: streamdoctor_default
    external: true
