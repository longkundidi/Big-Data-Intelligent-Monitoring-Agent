server {
    listen 80;
    server_name 177.8.0.54;

    gzip on;
    gzip_static on;     # 需要http_gzip_static_module 模块
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css;
    gzip_vary on;
    gzip_http_version   1.0; #兼容多层nginx 反代
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # 打包好的dist目录文件，放置到这个目录下
    root /data/;

    location /kg/files/uploadFile {
     client_max_body_size 1024M;
     sendfile on;
     keepalive_timeout 1800;
     proxy_pass   http://177.8.0.53:20015/files/uploadFile;
    }
    # 注意维护新增微服务，gateway 路由前缀
    location ~* ^/(code|auth|admin|gen|kg|al) {
       proxy_pass http://pig-gateway:9999;
       #proxy_set_header Host $http_host;
       proxy_connect_timeout 15s;
       proxy_send_timeout 15s;
       proxy_read_timeout 15s;
       proxy_set_header X-Forwarded-Proto http;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /chat/ {
     proxy_pass   http://192.168.65.34:7861;
     proxy_set_header Host $http_host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto  $scheme;
    }
    # 避免端点安全问题
    if ($request_uri ~ "/actuator"){
        return 403;
    }


}
