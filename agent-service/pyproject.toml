[project]
name = "streamdoctor"
version = "0.1.0"
description = "Evidence-backed Kafka and Flink incident diagnosis"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "httpx>=0.27,<1",
  "kafka-python>=2.0.2,<3",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain==1.4.2",
  "langchain-openai==1.6.2",
  "openai>=1.50,<3",
  "jieba>=0.42,<1",
  "rank-bm25>=0.2.2,<1",
  "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamdoctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
